          rec.start();await v.play();const dur=Math.min(5,v.duration||5)*1000,t0=performance.now();
          await new Promise(r=>{const L=()=>{x.drawImage(v,0,0,c.width,c.height);if(performance.now()-t0<dur&&!v.ended)requestAnimationFrame(L);else r()};L()});
          v.pause();rec.stop();await done;
          const vid=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(new Blob(ch,{type:rec.mimeType||'video/webm'}))});
          if(vid.length>900000)return $('ne').textContent='الفيديو ثقيل، جرب مقطع أبسط';
          await addDoc(collection(db,'posts'),{uid:me.uid,username:meDoc.username,avatar:meDoc.avatar||'',img:thumb,vid,cap:($('nc').value||'').trim(),likes:[],ts:Date.now()});A.tab('feed')}
          catch(e){$('ne').textContent='تعذر الفيد: '+(e.name||e.message)}},
          saveAcc(u,p){try{const L=JSON.parse(localStorage.getItem('lv_acc')||'[]').filter(x=>x.u!==u);L.push({u,p});localStorage.setItem('lv_acc',JSON.stringify(L))}catch(e){}},
          accts(){let L=[];try{L=JSON.parse(localStorage.getItem('lv_acc')||'[]')}catch(e){}const cu=me.email.split('@')[0],d=document.createElement('div');d.id='acx';d.style.cssText='position:fixed;inset:0;z-index:90;background:#000e;overflow-y:auto;padding:16px';
          d.innerHTML='<div class="gph"><b>🔄 الحسابات</b><button id="ax" style="font-size:20px">✖</button></div>'+L.map(a=>'<div class="item"><div class="pa">'+esc(a.u[0]).toUpperCase()+'</div><div class="t" onclick="A.sw(\''+a.u+'\')"><b>@'+esc(a.u)+'</b><small>'+(a.u===cu?'الحالي':'اضغط للتبديل')+'</small></div><button onclick="A.rmacc(\''+a.u+'\')">🗑</button></div>').join('')+'<button class="btn o" style="margin-top:14px" onclick="A.addacc()">➕ إضافة حساب</button>';
          document.body.appendChild(d);document.getElementById('ax').onclick=()=>d.remove()},
          rmacc(u){try{localStorage.setItem('lv_acc',JSON.stringify(JSON.parse(localStorage.getItem('lv_acc')||'[]').filter(x=>x.u!==u)))}catch(e){}document.getElementById('acx').remove();A.accts()},
          addacc(){document.getElementById('acx').remove();signOut(auth)},
          async sw(u){let a;try{a=JSON.parse(localStorage.getItem('lv_acc')||'[]').find(x=>x.u===u)}catch(e){}if(!a)return;document.getElementById('acx').remove();await signOut(auth);UC={};cur='feed';
          try{await signInWithEmailAndPassword(auth,u+'@levi.app',a.p)}catch(e){toast('تعذر الدخول')}}
          };
          </script>
          </body>
          </html>
          LEVIEOF
          cat > package.json <<'EOF'
          {"name":"levi","version":"1.4.0","private":true,"dependencies":{"@capacitor/android":"6.1.2","@capacitor/cli":"6.1.2","@capacitor/core":"6.1.2","@capacitor/local-notifications":"6.1.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.levi.app","appName":"LEVI","webDir":"www","backgroundColor":"#000000","server":{"androidScheme":"https","hostname":"levi-935b7.firebaseapp.com"}}
          EOF
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Icon and permissions
        run: |
          D=android/app/src/main/res
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-feature android:name="android.hardware.camera" android:required="false" /><application#' android/app/src/main/AndroidManifest.xml
          mkdir -p $D/drawable $D/values $D/mipmap-anydpi-v26
          cat > $D/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#E11D2E" android:pathData="M38,28h12v42h22v10H38z"/></vector>
          EOF
          cat > $D/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#000000</color></resources>
          EOF
          for n in ic_launcher ic_launcher_round; do
          cat > $D/mipmap-anydpi-v26/$n.xml <<'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_fg"/></adaptive-icon>
          EOF2
          done
          sed -i 's#@drawable/splash#@android:color/black#' $D/values/styles.xml || true
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Levi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
